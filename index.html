<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Luz Divina — Bisutería católica artesanal: rosarios, medallas, collares, anillos y pulseras hechos con fe." />
    <title>Luz Divina · Bisutería Católica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:ital,wght@0,300..700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; background-color: #f8f2e3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var tarjeta =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Jost,Trebuchet MS,sans-serif;color:#3a222c;">' +
          '<div style="max-width:560px;text-align:left;border:1px solid rgba(212,175,55,.5);background:#fff;padding:44px 40px;border-radius:16px;box-shadow:0 24px 60px rgba(51,16,29,.12);">' +
          '<div style="text-align:center;"><div style="font-family:Cinzel,Georgia,serif;font-size:26px;font-weight:700;color:#33101d;">Luz Divina</div>' +
          '<div style="margin-top:6px;font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#b8932c;">Bisutería católica</div></div>';

        function mostrar(contenido) {
          var root = document.getElementById("root");
          if (root) root.innerHTML = tarjeta + contenido + "</div></div>";
        }

        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (!root || root.children.length > 0) return;

            if (window.location.protocol === "file:") {
              mostrar(
                '<p style="margin-top:22px;line-height:1.6;font-size:15px;text-align:center;">Este sitio no puede abrirse con doble clic: el navegador bloquea su JavaScript en discos locales.</p>' +
                '<p style="margin-top:14px;font-size:14px;line-height:1.7;">Para verlo en tu PC, abre una terminal en la carpeta del proyecto y ejecuta:</p>' +
                '<code style="display:block;margin-top:14px;background:#33101d;color:#f0dd9d;padding:14px;border-radius:8px;font-size:14px;text-align:center;">npm run dev</code>' +
                '<p style="margin-top:12px;font-size:13px;line-height:1.7;">Después abre <strong>http://localhost:3000</strong> en tu navegador. Para ver la versión final: <code style="background:#f3ead3;padding:2px 6px;border-radius:4px;">npm run build</code> y luego <code style="background:#f3ead3;padding:2px 6px;border-radius:4px;">npx vite preview</code>.</p>'
              );
              return;
            }

            mostrar(
              '<p style="margin-top:22px;line-height:1.6;font-size:15px;text-align:center;">La página está publicada, pero la aplicación no cargó. ' +
              'Casi siempre es la configuración de GitHub Pages. Revisa en este orden:</p>' +
              '<ol style="margin:18px 0 0;padding-left:20px;font-size:14px;line-height:2;">' +
              '<li>En tu repositorio, entra a la pestaña <strong>Actions</strong>: el flujo <em>«Publicar en GitHub Pages»</em> debe aparecer <strong>en verde</strong>. Si está en amarillo, espera; si está en rojo o no aparece, vuelve a hacer <code style="background:#f3ead3;padding:1px 6px;border-radius:4px;">git push</code>.</li>' +
              '<li>Ve a <strong>Settings → Pages</strong> y en <em>«Build and deployment → Source»</em> elige <strong>GitHub Actions</strong> (no «Deploy from a branch»). Este es el error más común.</li>' +
              '<li>Abre la dirección completa, que <strong>incluye el nombre del repo</strong>: <code style="background:#f3ead3;padding:1px 6px;border-radius:4px;">https://TU-USUARIO.github.io/NOMBRE-DEL-REPO/</code></li>' +
              '<li>Recarga con <strong>Ctrl + Shift + R</strong> (o Cmd + Shift + R en Mac) para evitar una copia vieja guardada.</li>' +
              '</ol>' +
              '<p style="margin-top:16px;font-size:13px;line-height:1.7;color:#6b4a56;">Guía completa en el archivo <strong>DEPLOY.md</strong> del repositorio. Si el sitio ya funcionaba antes, con el paso 4 suele bastar.</p>'
            );
          }, 3500);
        });
      })();
    </script>
  </body>
</html>
